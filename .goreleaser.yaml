# GoReleaser configuration
# https://goreleaser.com

project_name: odin-discovery-controller

builds:
  - id: odin-discovery-controller
    main: ./cmd/main.go
    binary: odin-discovery-controller
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

dockers:
  - goos: linux
    goarch: amd64
    image_templates:
      - "{{ .Env.DOCKER_REGISTRY }}/{{ .Env.DOCKER_REPOSITORY }}:{{ .Version }}"
      - "{{ .Env.DOCKER_REGISTRY }}/{{ .Env.DOCKER_REPOSITORY }}:latest"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
    extra_files:
      - Dockerfile

  - goos: linux
    goarch: arm64
    image_templates:
      - "{{ .Env.DOCKER_REGISTRY }}/{{ .Env.DOCKER_REPOSITORY }}:{{ .Version }}-arm64"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm64"
    extra_files:
      - Dockerfile

dockermanifests:
  - name_template: "{{ .Env.DOCKER_REGISTRY }}/{{ .Env.DOCKER_REPOSITORY }}:{{ .Version }}"
    image_templates:
      - "{{ .Env.DOCKER_REGISTRY }}/{{ .Env.DOCKER_REPOSITORY }}:{{ .Version }}"
      - "{{ .Env.DOCKER_REGISTRY }}/{{ .Env.DOCKER_REPOSITORY }}:{{ .Version }}-arm64"
    skip_push: false

archives:
  - id: default
    format: tar.gz
    files:
      - LICENSE*
      - README.md

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

blobs:
  - provider: github
    owner: "{{ .Env.GITHUB_REPOSITORY_OWNER }}"
    bucket: "{{ .Env.GITHUB_REPOSITORY_NAME }}"

release:
  mode: replace
  header: |
    ## {{ .TagName }}
    
    {{ .ReleaseNotes }}

  footer: |
    ---
    
    **Full Changelog**: {{ .PreviousTag }}...{{ .Tag }}
