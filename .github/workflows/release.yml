name: Publish Release

on:
  release:
    types: [released]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release branch
        run: |
          if [[ "${{ github.event.release.target_commitish }}" != "${{ github.event.repository.default_branch }}" ]]; then
            echo "::error:: Releases must be created from the default branch (${{ github.event.repository.default_branch }})"
            echo "This release was created from: ${{ github.event.release.target_commitish }}"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GH_BOT_TOKEN }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@19bb51245e9c80abacb2e91cc42b33fa478b8639
        with:
          go-version: '1.17'

      - name: Login to docker
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Get version from tag
        id: get_version
        run: |
          releaseVersion="${{ github.event.release.tag_name }}"
          releaseVersion="${releaseVersion//v/}"
          echo "VERSION=$releaseVersion" >> "$GITHUB_OUTPUT"
          echo "Release version: $releaseVersion"

      - name: Update version.go
        run: |
          sed -i.bak "s/const Version = \"v.*\"/const Version = \"v${{ steps.get_version.outputs.VERSION }}\"/" version.go
          rm -f version.go.bak
          echo "Updated version.go:"
          grep "const Version" version.go

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a #v6.4.0
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
          DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
          DOCKER_REPOSITORY: ${{ vars.DOCKER_REPOSITORY }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}

      - name: Setup git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: .ci/scripts/bump-version.sh || {
          echo "::warn:: Version bump failed. Manual intervention may be required."
          echo "The release was successful but the version wasn't bumped in the repository."
          exit 0  # Don't fail the release for this
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
